# GrailTrackrr plugin settings.
# D2RLoader copies this to d2rloader/config/grailtrackrr.toml the first time it runs.

[grailtrackrr]
# From the Profile page on grailtrackrr.com. Keep it private.
api_key = ""

# In-game card for each new grail item, and for each badge earned.
item_popup = true
badge_popup = true

# How long each card stays on screen, in seconds.
popup_seconds = 6

# Connection line in the bottom-left corner while in game.
show_status = true
