# GrailTrackrr plugin settings.
# D2RLoader copies this to d2rloader/config/grailtrackrr.toml the first time it runs.

[grailtrackrr]
# From the My grail page on grailtrackrr.com. Keep it private.
api_key = ""

# Popup for each new grail item (seconds on screen; 0 turns it off).
popup_seconds = 6

# Connection line in the bottom-left corner while in game.
show_status = true
